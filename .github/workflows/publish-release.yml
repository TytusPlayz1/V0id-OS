name: Publish OS release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    name: Publish release assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d dist ]]; then
            echo 'No dist/ directory found. Build the OS and place release files in dist/ before tagging.' >&2
            exit 1
          fi

          mapfile -d '' assets < <(find dist -type f -print0)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo 'No release assets found in dist/.' >&2
            exit 1
          fi

          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes
